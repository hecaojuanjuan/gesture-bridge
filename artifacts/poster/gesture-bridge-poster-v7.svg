<title id="title">Gesture Bridge</title>
<desc id="description">A minimal gesture-to-speech poster. An open hand with anatomical recognition landmarks leads into a sound wave and the spoken example 我想喝水。The phrase is an expression example, not a universal hand sign.</desc>
